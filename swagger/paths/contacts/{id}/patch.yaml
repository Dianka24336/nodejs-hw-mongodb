tags:
  - Contacts
summary: Update contact
operationId: updateContact
description: 'Updating the fields in a contact'
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      example: '65ca67e7ae7f10c88b598384'
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            description: "New contact's name"
            type: string
            example: 'John Doe'
          phoneNumber:
            description: "New contact's phone number"
            type: string
            example: '+380000000006'
          email:
            description: "New contact's email"
            type: string
            example: andriy7@example.com
          isFavourite:
            description: "Change the status of favourite"
            type: boolean
            example: false
          contactType:
            description: "Change to which type the contact belongs"
            type: string
            enum: ['work', 'home', 'personal']
          photo:
            description: "New contact's photo"
            type: string
            format: binary
responses:
  '200':
    description: Update a contact by id
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully patched a contact!
            data:
              type: object
              $ref: ../../../components/schemas/contact.yaml
  '400':
    $ref: '../../../components/responses/400.yaml'
  '401':
    $ref: '../../../components/responses/401.yaml'
  '404':
    $ref: '../../../components/responses/404.yaml'
  '500':
    $ref: '../../../components/responses/500.yaml'
