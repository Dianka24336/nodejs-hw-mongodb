type: object
required:
  - name
  - phoneNumber
  - contactType
properties:
  _id:
    description: "Contact's id"
    type: string
    example: 67be339f7b813247759448d0
  name:
    description: "Contact's name"
    type: string
    example: 'John Doe'
  phoneNumber:
    description: "Contact's phone number"
    type: string
    example: '+380000000006'
  email:
    description: "Contact's email"
    type: string
    example: andriy7@example.com
    
  isFavourite:
    description: "Whether the contact is a favourite"
    type: boolean
    example: false
  contactType:
    description: "To which type the contact belongs"
    type: string
    enum: ['work', 'home', 'personal']   
  userId:
    description: "Contact's user id"
    type: string
    example: 67be339f7b813247759448d0
  photo:
    description: "Link to contact's photo"
    type: string
    example: https://res.cloudinary.com/uqwgdu/image/upload/image.png